<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mídia no Carro</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0b1020;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{width:100vw;height:100vh;display:grid;grid-template-rows:82px 1fr 44px}
.topo,.rodape{background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:50}
.hora{font-size:38px;font-weight:800}.info{text-align:right;font-size:14px}
.palco{position:relative;overflow:hidden;background:#050814}
.slide{position:absolute;inset:0;opacity:0;transform:scale(1.025);transition:opacity .65s ease,transform 5s ease;overflow:hidden}
.slide.ativo{opacity:1;transform:scale(1)}
.slide>img,.slide>video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.slide.conter>img,.slide.conter>video{object-fit:contain}
.vazio{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9ca3af}
.progresso{position:absolute;left:0;bottom:0;height:4px;width:0;background:#fff;z-index:45}
.rodape{font-size:12px;color:#d1d5db}
.admin{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}
.admin.aberto{display:flex}.card{width:min(900px,96vw);max-height:88vh;overflow:auto;background:#111827;border-radius:16px;padding:18px}
.topadmin{display:flex;justify-content:space-between;align-items:center}
.metricas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metrica{background:#0b1020;padding:12px;border-radius:10px}.metrica small{color:#9ca3af;display:block}.metrica strong{font-size:24px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---------- LA CARVALHO: MINI CAMPANHA ANIMADA ---------- */
.la{position:absolute;inset:0;background:#efe8dc;color:#18332c;overflow:hidden}
.la .scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.la.run .scene{animation:laScene 28s linear forwards}
.la .s1{animation-delay:0s!important}.la .s2{animation-delay:5s!important}.la .s3{animation-delay:10.5s!important}.la .s4{animation-delay:16s!important}.la .s5{animation-delay:21.5s!important}
@keyframes laScene{0%{opacity:0}4%{opacity:1}17%{opacity:1}21%{opacity:0}100%{opacity:0}}

.la .photo{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:saturate(.98) contrast(1.02)}
.la.run .s1 .photo{animation:slowZoom 5.8s ease-out forwards}
.la.run .s2 .photo{animation:panLeft 6s ease-out forwards}
.la.run .s3 .photo{animation:panRight 6s ease-out forwards}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.10)}}
@keyframes panLeft{from{transform:scale(1.08) translateX(2%)}to{transform:scale(1.14) translateX(-2%)}}
@keyframes panRight{from{transform:scale(1.08) translateX(-2%)}to{transform:scale(1.14) translateX(2%)}}

.la .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,24,19,.78) 0%,rgba(8,24,19,.38) 44%,rgba(8,24,19,.05) 72%)}
.la .shade-bottom{position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,24,19,.80) 0%,rgba(8,24,19,.10) 54%)}
.la .copy{position:absolute;z-index:5;left:7%;top:50%;transform:translateY(-50%);width:min(630px,74%);text-shadow:0 2px 12px rgba(0,0,0,.25)}
.la .copy.light{color:#fff}
.la .eyebrow{font-size:clamp(12px,1.7vw,18px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}
.la h1,.la h2{margin:0;line-height:.96;font-family:Georgia,"Times New Roman",serif;font-weight:500}
.la h1{font-size:clamp(40px,6.6vw,86px)}.la h2{font-size:clamp(34px,5.4vw,68px)}
.la p{font-size:clamp(16px,2vw,24px);line-height:1.35;max-width:620px}
.la .accent{color:#d5b777;font-style:italic}
.la .line{height:2px;background:#d5b777;width:0;margin:18px 0}
.la.run .line{animation:growLine 1.1s .45s ease forwards}
@keyframes growLine{to{width:min(340px,70%)}}

.la .reveal{opacity:0;transform:translateY(24px)}
.la.run .scene .reveal{animation:revealUp .8s ease forwards}
.la.run .scene .reveal.r2{animation-delay:.35s}.la.run .scene .reveal.r3{animation-delay:.7s}
@keyframes revealUp{to{opacity:1;transform:translateY(0)}}

.la .paint-wipe{position:absolute;z-index:9;inset:-20% -10%;background:#d5b777;transform:translateX(-120%) skewX(-12deg);opacity:.95}
.la.run .s4 .paint-wipe{animation:paintWipe 1.25s ease-in-out forwards}
@keyframes paintWipe{0%{transform:translateX(-120%) skewX(-12deg)}55%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(120%) skewX(-12deg)}}

.la .s4{background:#18332c;color:#f5efe6;display:grid;place-items:center;text-align:center;padding:6%}
.la .s4 .question{max-width:1000px;position:relative;z-index:3}
.la .s4 .question small{display:block;letter-spacing:.22em;text-transform:uppercase;color:#d5b777;font-weight:800;margin-bottom:18px}
.la .s4 strong{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,6vw,82px);font-weight:500;line-height:1.03}

.la .s5{background:#f2eadf;color:#17372e;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;padding:5% 7%;gap:5%}
.la .final-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(40px,6vw,78px);line-height:1}
.la .final-sub{font-size:clamp(16px,2vw,24px);line-height:1.45;max-width:680px}
.la .cta{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:12px 18px;border:1px solid #17372e;border-radius:999px;font-weight:800}
.la .qrbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.la .qrbox img{width:min(260px,30vw);aspect-ratio:1;object-fit:contain;background:#fff;padding:10px;border-radius:16px;box-shadow:0 18px 45px rgba(29,52,44,.18)}
.la .handle{font-weight:800;letter-spacing:.04em}
.la .brand{position:absolute;right:4%;top:4%;z-index:8;background:rgba(245,239,230,.92);color:#17372e;padding:8px 14px;border-radius:999px;font-weight:800;letter-spacing:.08em;font-size:12px}

/* brilho sutil */
.la .glint{position:absolute;z-index:7;top:-30%;left:-30%;width:28%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);transform:rotate(18deg);opacity:0}
.la.run .glint{animation:glint 4.6s 1.0s ease-in-out infinite}
@keyframes glint{0%,55%{left:-35%;opacity:0}64%{opacity:.8}82%{left:120%;opacity:0}100%{left:120%;opacity:0}}

@media(max-width:700px){
 .metricas{grid-template-columns:repeat(2,1fr)}.hora{font-size:30px}.topo{padding:0 14px}
 .la .s5{grid-template-columns:1fr 180px;padding:5%}.la .copy{width:78%}
}
</style>
</head>
<body>
<div class="app">
<header class="topo">
  <div class="hora" id="hora">--:--</div>
  <div class="info">📍 <span id="cidade">Localizando...</span><br><span id="clima">🌤️ --°C</span> · <span id="rede">...</span></div>
</header>
<main class="palco" id="palco">
  <div class="vazio" id="vazio"><div><h1>Espaço publicitário</h1><div>Nenhuma campanha ativa.</div></div></div>
  <div class="progresso" id="progresso"></div>
</main>
<footer class="rodape"><b>Mídia no Carro</b><span id="campanhaAtual">Aguardando campanha</span><span id="qtdCampanhas">0 campanhas</span></footer>
</div>

<div class="admin" id="admin">
 <div class="card">
  <div class="topadmin"><div><h2 style="margin:0">Painel de métricas</h2><small>Pressione A para abrir/fechar</small></div><button id="fechar">Fechar</button></div>
  <div class="metricas">
    <div class="metrica"><small>Exibições hoje</small><strong id="mHoje">0</strong></div>
    <div class="metrica"><small>Exibições totais</small><strong id="mTotal">0</strong></div>
    <div class="metrica"><small>Campanhas ativas</small><strong id="mAtivas">0</strong></div>
    <div class="metrica"><small>Atualização</small><strong id="mAtualizacao" style="font-size:16px">--</strong></div>
  </div>
  <table><thead><tr><th>Campanha</th><th>Hoje</th><th>Total</th><th>Última exibição</th></tr></thead><tbody id="tabela"></tbody></table>
  <div class="acoes"><button id="atualizar">Atualizar campanhas</button><button id="fullscreen">Tela cheia</button><button id="zerar">Zerar métricas</button></div>
 </div>
</div>

<script>
const CONFIG={arquivo:"./campanhas.json",intervaloCampanhas:60000,intervaloClima:900000,chaveMetricas:"midia_metricas_v2"};
let todas=[],ativas=[],indice=-1,timer=null,slideAtual=null,ultimaAtualizacao=null;
const $=id=>document.getElementById(id);

function dataHoje(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function hmMin(h){if(!h)return null;const[a,b]=h.split(":").map(Number);return a*60+b}
function noHorario(c){if(!c.horaInicio&&!c.horaFim)return true;const n=new Date(),m=n.getHours()*60+n.getMinutes(),a=hmMin(c.horaInicio||"00:00"),b=hmMin(c.horaFim||"23:59");return a<=b?(m>=a&&m<=b):(m>=a||m<=b)}
function noDia(c){return !Array.isArray(c.diasSemana)||!c.diasSemana.length||c.diasSemana.includes(new Date().getDay())}
function estaAtiva(c){const h=dataHoje();return c.ativa!==false&&(!c.inicio||h>=c.inicio)&&(!c.fim||h<=c.fim)&&noHorario(c)&&noDia(c)}

async function carregarCampanhas(){
 try{
   const r=await fetch(`${CONFIG.arquivo}?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw 0;
   const j=await r.json();todas=Array.isArray(j.campanhas)?j.campanhas:[];
   localStorage.setItem("cache_campanhas_v2",JSON.stringify(todas));ultimaAtualizacao=new Date();
 }catch(e){todas=JSON.parse(localStorage.getItem("cache_campanhas_v2")||"[]")}
 recalcular()
}
function recalcular(){
 const novas=todas.filter(estaAtiva).sort((a,b)=>(b.prioridade||0)-(a.prioridade||0));
 const mudou=novas.map(x=>x.id).join("|")!==ativas.map(x=>x.id).join("|");ativas=novas;
 $("qtdCampanhas").textContent=`${ativas.length} campanha${ativas.length===1?"":"s"} ativa${ativas.length===1?"":"s"}`;
 if(mudou||indice<0)reiniciar();atualizarPainel()
}
function reiniciar(){
 clearTimeout(timer);indice=-1;
 if(slideAtual){slideAtual.remove();slideAtual=null}
 if(!ativas.length){$("vazio").style.display="grid";$("campanhaAtual").textContent="Nenhuma campanha ativa";return}
 $("vazio").style.display="none";proxima()
}
function criarLA(){
 const s=document.createElement("div");s.className="slide";
 s.innerHTML=`
 <div class="la">
   <div class="brand">LA CARVALHO ART</div>
   <div class="glint"></div>

   <section class="scene s1">
     <img class="photo" src="midias/la_carvalho_parede_verde.jpg" alt="">
     <div class="shade"></div>
     <div class="copy light">
       <div class="eyebrow reveal">Paredes também comunicam</div>
       <h1 class="reveal r2">E se uma parede pudesse <span class="accent">contar uma história?</span></h1>
       <div class="line"></div>
     </div>
   </section>

   <section class="scene s2">
     <img class="photo" src="midias/la_carvalho_artista.jpg" alt="">
     <div class="shade-bottom"></div>
     <div class="copy light" style="top:auto;bottom:8%;transform:none">
       <div class="eyebrow reveal">Arte feita à mão</div>
       <h2 class="reveal r2">Cada projeto começa <span class="accent">antes do primeiro traço.</span></h2>
       <p class="reveal r3">Ideia, espaço e identidade transformados em pintura.</p>
     </div>
   </section>

   <section class="scene s3">
     <img class="photo" src="midias/la_carvalho_cafeteria.jpg" alt="">
     <div class="shade"></div>
     <div class="copy light">
       <div class="eyebrow reveal">Para marcas e ambientes</div>
       <h2 class="reveal r2">Um espaço comum pode virar <span class="accent">um lugar que as pessoas lembram.</span></h2>
       <p class="reveal r3">Comércio, residência, ateliê, cafeteria — cada parede pode ter sua própria linguagem.</p>
     </div>
   </section>

   <section class="scene s4">
     <div class="paint-wipe"></div>
     <div class="question">
       <small class="reveal">Imagine por um instante</small>
       <strong class="reveal r2">E se a sua marca<br>virasse <span class="accent">parte do ambiente?</span></strong>
     </div>
   </section>

   <section class="scene s5">
     <div>
       <div class="eyebrow reveal">LA Carvalho Art</div>
       <div class="final-title reveal r2">Sua parede.<br><span class="accent">Sua história.</span></div>
       <p class="final-sub reveal r3">Pinturas personalizadas para transformar ambientes e fortalecer identidades.</p>
       <div class="cta reveal r3">Aponte a câmera e conheça o trabalho →</div>
     </div>
     <div class="qrbox reveal r3">
       <img src="midias/qrcode_instagram_la_carvalho.png" alt="QR Code Instagram">
       <div class="handle">@lacarvalho.art</div>
     </div>
   </section>
 </div>`;
 return {s,m:null,custom:true}
}
function criarMidia(c){
 if(c.tipo==="la_carvalho")return criarLA();
 const s=document.createElement("div");s.className="slide "+(c.ajuste==="conter"?"conter":"");let m;
 if(c.tipo==="video"){m=document.createElement("video");m.src=c.arquivo;m.muted=c.mudo!==false;m.playsInline=true;m.preload="auto"}
 else{m=document.createElement("img");m.src=c.arquivo;m.alt=c.nome||"Campanha"}s.appendChild(m);return{s,m,custom:false}
}
function progresso(ms){const p=$("progresso");p.style.transition="none";p.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition=`width ${ms}ms linear`;p.style.width="100%"}))}
function proxima(){
 clearTimeout(timer);if(!ativas.length)return;indice=(indice+1)%ativas.length;const c=ativas[indice],obj=criarMidia(c),s=obj.s,m=obj.m;
 $("palco").appendChild(s);requestAnimationFrame(()=>{s.classList.add("ativo");const la=s.querySelector(".la");if(la)la.classList.add("run")});
 if(slideAtual){const a=slideAtual;a.classList.remove("ativo");setTimeout(()=>a.remove(),850)}slideAtual=s;
 $("campanhaAtual").textContent=c.nome||c.id;registrar(c);const ms=Math.max(3,Number(c.duracaoSegundos||12))*1000;progresso(ms);
 if(c.tipo==="video"&&m)m.play().catch(()=>{});timer=setTimeout(proxima,ms)
}
function lerM(){try{return JSON.parse(localStorage.getItem(CONFIG.chaveMetricas))||{}}catch{return{}}}
function salvarM(m){localStorage.setItem(CONFIG.chaveMetricas,JSON.stringify(m))}
function registrar(c){const m=lerM(),id=c.id||c.nome||c.arquivo,h=dataHoje();if(!m[id])m[id]={nome:c.nome||id,total:0,dias:{},ultima:null};m[id].total++;m[id].dias[h]=(m[id].dias[h]||0)+1;m[id].ultima=new Date().toISOString();salvarM(m);atualizarPainel()}
function atualizarPainel(){const m=lerM(),h=dataHoje(),arr=Object.values(m);$("mHoje").textContent=arr.reduce((s,x)=>s+(x.dias?.[h]||0),0);$("mTotal").textContent=arr.reduce((s,x)=>s+(x.total||0),0);$("mAtivas").textContent=ativas.length;$("mAtualizacao").textContent=ultimaAtualizacao?ultimaAtualizacao.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"--";$("tabela").innerHTML=arr.map(x=>`<tr><td>${x.nome}</td><td>${x.dias?.[h]||0}</td><td>${x.total||0}</td><td>${x.ultima?new Date(x.ultima).toLocaleString("pt-BR"):"--"}</td></tr>`).join("")}
function hora(){$("hora").textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function rede(){$("rede").textContent=navigator.onLine?"online":"offline"}
function localClima(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;try{const[g,w]=await Promise.all([fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`,{headers:{"Accept-Language":"pt-BR"}}),fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`)]);const gj=await g.json(),wj=await w.json();$("cidade").textContent=gj.address?.city||gj.address?.town||gj.address?.village||gj.address?.municipality||"Local atual";$("clima").textContent=wj.current?.temperature_2m!=null?`🌤️ ${Math.round(wj.current.temperature_2m)}°C`:"🌤️ --°C"}catch(e){}},()=>{$("cidade").textContent="Localização não autorizada"},{timeout:12000,maximumAge:600000})}
async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}
$("fechar").onclick=()=>$("admin").classList.remove("aberto");$("atualizar").onclick=carregarCampanhas;$("fullscreen").onclick=fullscreen;$("zerar").onclick=()=>{if(confirm("Apagar todas as métricas?")){localStorage.removeItem(CONFIG.chaveMetricas);atualizarPainel()}};
document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="a")$("admin").classList.toggle("aberto");if(e.key.toLowerCase()==="f")fullscreen()});
addEventListener("online",()=>{rede();carregarCampanhas();localClima()});addEventListener("offline",rede);
setInterval(recalcular,30000);setInterval(carregarCampanhas,CONFIG.intervaloCampanhas);setInterval(localClima,CONFIG.intervaloClima);
hora();setInterval(hora,1000);rede();localClima();carregarCampanhas();
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
