<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Mídia no Carro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0b1020;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{width:100vw;height:100vh;display:grid;grid-template-rows:84px 1fr 46px}
.topo,.rodape{background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.hora{font-size:38px;font-weight:800}.info{text-align:right;font-size:14px}.status{font-size:12px;opacity:.8}
.palco{position:relative;overflow:hidden;background:#050814}
.slide{position:absolute;inset:0;opacity:0;transform:scale(1.025);transition:opacity .7s ease,transform 5s ease}
.slide.ativo{opacity:1;transform:scale(1)}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.slide.conter img,.slide.conter video{object-fit:contain}
.vazio{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9ca3af}
.vazio h1{color:#fff;margin:0 0 8px}
.progresso{position:absolute;left:0;bottom:0;height:4px;width:0;background:#fff}
.rodape{font-size:12px;color:#d1d5db}
.admin{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}
.admin.aberto{display:flex}.card{width:min(900px,96vw);max-height:88vh;overflow:auto;background:#111827;border-radius:16px;padding:18px}
.topadmin{display:flex;justify-content:space-between;align-items:center}
.metricas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.metrica{background:#0b1020;padding:12px;border-radius:10px}.metrica small{color:#9ca3af;display:block}.metrica strong{font-size:24px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
@media(max-width:700px){.metricas{grid-template-columns:repeat(2,1fr)}.hora{font-size:30px}.topo{padding:0 14px}}
</style>
</head>
<body>
<div class="app">
<header class="topo">
  <div class="hora" id="hora">--:--</div>
  <div class="info">📍 <span id="cidade">Localizando...</span><br><span id="clima">🌤️ --°C</span> · <span id="rede">...</span></div>
</header>
<main class="palco" id="palco">
  <div class="vazio" id="vazio"><div><h1>Espaço publicitário</h1><div>Nenhuma campanha ativa.</div></div></div>
  <div class="progresso" id="progresso"></div>
</main>
<footer class="rodape"><b>Mídia no Carro</b><span id="campanhaAtual">Aguardando campanha</span><span id="qtdCampanhas">0 campanhas</span></footer>
</div>

<div class="admin" id="admin">
 <div class="card">
  <div class="topadmin"><div><h2 style="margin:0">Painel de métricas</h2><small>Pressione A para abrir/fechar</small></div><button id="fechar">Fechar</button></div>
  <div class="metricas">
    <div class="metrica"><small>Exibições hoje</small><strong id="mHoje">0</strong></div>
    <div class="metrica"><small>Exibições totais</small><strong id="mTotal">0</strong></div>
    <div class="metrica"><small>Campanhas ativas</small><strong id="mAtivas">0</strong></div>
    <div class="metrica"><small>Atualização</small><strong id="mAtualizacao" style="font-size:16px">--</strong></div>
  </div>
  <table><thead><tr><th>Campanha</th><th>Hoje</th><th>Total</th><th>Última exibição</th></tr></thead><tbody id="tabela"></tbody></table>
  <div class="acoes">
    <button id="atualizar">Atualizar campanhas</button>
    <button id="fullscreen">Tela cheia</button>
    <button id="zerar">Zerar métricas</button>
  </div>
 </div>
</div>

<script>
const CONFIG={arquivo:"./campanhas.json",intervaloCampanhas:60000,intervaloClima:900000,chaveMetricas:"midia_metricas_v1"};
let todas=[],ativas=[],indice=-1,timer=null,slideAtual=null,ultimaAtualizacao=null;
const $=id=>document.getElementById(id);

function dataHoje(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function hmMin(h){if(!h)return null;const[a,b]=h.split(":").map(Number);return a*60+b}
function noHorario(c){if(!c.horaInicio&&!c.horaFim)return true;const n=new Date(),m=n.getHours()*60+n.getMinutes(),a=hmMin(c.horaInicio||"00:00"),b=hmMin(c.horaFim||"23:59");return a<=b?(m>=a&&m<=b):(m>=a||m<=b)}
function noDia(c){return !Array.isArray(c.diasSemana)||!c.diasSemana.length||c.diasSemana.includes(new Date().getDay())}
function estaAtiva(c){const h=dataHoje();return c.ativa!==false&&(!c.inicio||h>=c.inicio)&&(!c.fim||h<=c.fim)&&noHorario(c)&&noDia(c)}

async function carregarCampanhas(){
 try{
   const r=await fetch(`${CONFIG.arquivo}?t=${Date.now()}`,{cache:"no-store"}); if(!r.ok)throw 0;
   const j=await r.json(); todas=Array.isArray(j.campanhas)?j.campanhas:[];
   localStorage.setItem("cache_campanhas",JSON.stringify(todas)); ultimaAtualizacao=new Date();
 }catch(e){todas=JSON.parse(localStorage.getItem("cache_campanhas")||"[]")}
 recalcular();
}
function recalcular(){
 const novas=todas.filter(estaAtiva).sort((a,b)=>(b.prioridade||0)-(a.prioridade||0));
 const mudou=novas.map(x=>x.id).join("|")!==ativas.map(x=>x.id).join("|");
 ativas=novas;
 $("qtdCampanhas").textContent=`${ativas.length} campanha${ativas.length===1?"":"s"} ativa${ativas.length===1?"":"s"}`;
 if(mudou||indice<0)reiniciar();
 atualizarPainel();
}
function reiniciar(){
 clearTimeout(timer);indice=-1;
 if(slideAtual){slideAtual.remove();slideAtual=null}
 if(!ativas.length){$("vazio").style.display="grid";$("campanhaAtual").textContent="Nenhuma campanha ativa";return}
 $("vazio").style.display="none";proxima();
}
function criarMidia(c){
 const s=document.createElement("div");s.className="slide "+(c.ajuste==="conter"?"conter":"");
 let m;
 if(c.tipo==="video"){m=document.createElement("video");m.src=c.arquivo;m.muted=c.mudo!==false;m.playsInline=true;m.preload="auto"}
 else{m=document.createElement("img");m.src=c.arquivo;m.alt=c.nome||"Campanha"}
 s.appendChild(m);return{s,m}
}
function progresso(ms){const p=$("progresso");p.style.transition="none";p.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition=`width ${ms}ms linear`;p.style.width="100%"}))}
function proxima(){
 clearTimeout(timer); if(!ativas.length)return;
 indice=(indice+1)%ativas.length;const c=ativas[indice],{s,m}=criarMidia(c);$("palco").appendChild(s);requestAnimationFrame(()=>s.classList.add("ativo"));
 if(slideAtual){const a=slideAtual;a.classList.remove("ativo");setTimeout(()=>a.remove(),800)} slideAtual=s;
 $("campanhaAtual").textContent=c.nome||c.id; registrar(c);
 const ms=Math.max(3,Number(c.duracaoSegundos||12))*1000;progresso(ms);if(c.tipo==="video")m.play().catch(()=>{});
 timer=setTimeout(proxima,ms)
}
function lerM(){try{return JSON.parse(localStorage.getItem(CONFIG.chaveMetricas))||{}}catch{return{}}}
function salvarM(m){localStorage.setItem(CONFIG.chaveMetricas,JSON.stringify(m))}
function registrar(c){
 const m=lerM(),id=c.id||c.nome||c.arquivo,h=dataHoje();
 if(!m[id])m[id]={nome:c.nome||id,total:0,dias:{},ultima:null};
 m[id].total++;m[id].dias[h]=(m[id].dias[h]||0)+1;m[id].ultima=new Date().toISOString();salvarM(m);atualizarPainel()
}
function atualizarPainel(){
 const m=lerM(),h=dataHoje(),arr=Object.values(m);
 $("mHoje").textContent=arr.reduce((s,x)=>s+(x.dias?.[h]||0),0);
 $("mTotal").textContent=arr.reduce((s,x)=>s+(x.total||0),0);
 $("mAtivas").textContent=ativas.length;
 $("mAtualizacao").textContent=ultimaAtualizacao?ultimaAtualizacao.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"--";
 $("tabela").innerHTML=arr.map(x=>`<tr><td>${x.nome}</td><td>${x.dias?.[h]||0}</td><td>${x.total||0}</td><td>${x.ultima?new Date(x.ultima).toLocaleString("pt-BR"):"--"}</td></tr>`).join("")
}
function hora(){ $("hora").textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) }
function rede(){ $("rede").textContent=navigator.onLine?"online":"offline" }
function localClima(){
 if(!navigator.geolocation)return;
 navigator.geolocation.getCurrentPosition(async p=>{
   const lat=p.coords.latitude,lon=p.coords.longitude;
   try{
     const [g,w]=await Promise.all([
       fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`,{headers:{"Accept-Language":"pt-BR"}}),
       fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`)
     ]);
     const gj=await g.json(),wj=await w.json();
     $("cidade").textContent=gj.address?.city||gj.address?.town||gj.address?.village||gj.address?.municipality||"Local atual";
     $("clima").textContent=wj.current?.temperature_2m!=null?`🌤️ ${Math.round(wj.current.temperature_2m)}°C`:"🌤️ --°C"
   }catch(e){}
 },()=>{$("cidade").textContent="Localização não autorizada"},{timeout:12000,maximumAge:600000})
}
async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}

$("fechar").onclick=()=>$("admin").classList.remove("aberto");
$("atualizar").onclick=carregarCampanhas;
$("fullscreen").onclick=fullscreen;
$("zerar").onclick=()=>{if(confirm("Apagar todas as métricas?")){localStorage.removeItem(CONFIG.chaveMetricas);atualizarPainel()}};
document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="a")$("admin").classList.toggle("aberto");if(e.key.toLowerCase()==="f")fullscreen()});
addEventListener("online",()=>{rede();carregarCampanhas();localClima()});addEventListener("offline",rede);

setInterval(recalcular,30000);setInterval(carregarCampanhas,CONFIG.intervaloCampanhas);setInterval(localClima,CONFIG.intervaloClima);
hora();setInterval(hora,1000);rede();localClima();carregarCampanhas();

if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
